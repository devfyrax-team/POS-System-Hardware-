# One VPS, HTTPS on every subdomain: api. (backend), app. (POS + back office PWA), admin. (platform admin), www. (company site).
# Put real certificates in infra/certs (e.g. from certbot) and replace example.lk.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server { listen 80; server_name _; return 301 https://$host$request_uri; }

upstream pos_api { server api:3000; keepalive 32; }

server {
  listen 443 ssl http2;
  server_name api.example.lk admin.example.lk;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16m;                      # bulk import uploads
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # the platform admin API is only reachable through the admin. host
  location /v1/admin/ {
    if ($host != "admin.example.lk") { return 404; }
    proxy_pass http://pos_api;
  }
  location / {
    proxy_pass http://pos_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
