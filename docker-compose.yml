services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment:
      DATABASE_URL: postgres://pos_app:pos_app@postgres:5432/pos
      ADMIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/pos
      JWT_SECRET: change-me
    depends_on: [postgres]
    ports: ["3000:3000"]
    profiles: ["full"]
volumes:
  pgdata:
